  <path d="M 22 92 A 50 50 0 0 0 52 110" fill="none" stroke="#2E7D6B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="97" cy="38" r="6" fill="#2E7D6B"/>
  <circle cx="64" cy="46" r="10" fill="#C8442C"/>
  <circle cx="64" cy="46" r="4" fill="#FFFFFF"/>
  <text x="64" y="102" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
